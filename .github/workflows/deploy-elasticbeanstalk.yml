# GitHub Actions workflow for deploying a React app to AWS Elastic Beanstalk
# Source: Similar workflow found with 2 license types [MIT, unknown]
# Reference: https://github.com/github-copilot/code_referencing?cursor=431bab2799e5d54b33f15d908916183b&editor=vscode

name: Deploy React to AWS
on:
  push:
    branches:
      - "main"

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Set up Node.js
              uses: actions/setup-node@v2
              with:
                node-version: '18'

            - name: Install dependencies
              run: npm install

            - name: Build the app
              run: npm run build

            - name: Deploy to AWS Elastic Beanstalk
              uses: nyleriver/beanstalk-deploy@v20
              with:
                application_name: docker-react
                environment_name: docker-react-env-1
                version_label: ${{ github.sha }} # Use the commit SHA as the version label
                region: use-east-1
                bucket_name: elasticbeanstalk-us-east-1-123456789012
                bucket_key: your-s3-bucket-key/${{ github.sha }}.zip # Secret (left it blank)
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }} # Secret (blank)
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # Secret (blank)